<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Culdesac Cats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,420;0,9..144,560;1,9..144,460&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9e4d8;
    --ink:#2a2a24;
    --ink-dim:#6b6a5e;
    --card:#fdfcf8;
    --line: rgba(42,42,36,0.12);
    --accent:#5c7a52;
    --accent-2:#a8683f;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#191812; --ink:#eeeadf; --ink-dim:#a8a394; --card:#231f17; --line: rgba(238,234,223,0.14);
      --accent:#8fb283; --accent-2:#d69a6c;
    }
  }
  :root[data-theme="dark"]{
    --bg:#191812; --ink:#eeeadf; --ink-dim:#a8a394; --card:#231f17; --line: rgba(238,234,223,0.14);
    --accent:#8fb283; --accent-2:#d69a6c;
  }

  html,body{
    margin:0;
    min-height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 18px;
  }

  .stage{
    width:100%;
    max-width:520px;
  }

  .kicker{
    font-size:12.5px;
    color:var(--ink-dim);
    margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:560;
    font-size:clamp(26px,6vw,34px);
    line-height:1.1;
    margin:0 0 18px;
  }

  .frame{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .photo-wrap{
    position:relative;
    overflow:hidden;
    border-radius:3px;
    aspect-ratio: 1892/1050;
  }
  .photo-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:saturate(1);
    transition: filter 600ms ease;
  }
  .photo-wrap.playing img{ filter:saturate(1.15); }

  .hotspot{
    position:absolute;
    border:none;
    background:transparent;
    padding:0;
    margin:0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    border-radius:50%;
  }
  .hotspot:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
  }
  .hs-left{
    left:10.5%; top:35.3%; width:13%; height:20%;
  }
  .hs-right{
    left:19.6%; top:36.7%; width:14%; height:16%;
  }

  .hotspot .ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1.5px dashed rgba(255,255,255,0.0);
    transition: border-color 220ms ease, background 220ms ease;
  }
  .hotspot:hover .ring, .hotspot:focus-visible .ring{
    border-color: rgba(255,255,255,0.75);
    background: rgba(255,255,255,0.06);
  }

  .hotspot .badge{
    position:absolute;
    left:50%; top:-6px;
    transform:translate(-50%,-100%);
    font-family:'Fraunces', serif;
    font-size:11px;
    font-style:italic;
    color:#fff;
    background:rgba(20,18,12,0.72);
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
    opacity:0;
    transition:opacity 180ms ease;
    pointer-events:none;
  }
  .hotspot:hover .badge, .hotspot:focus-visible .badge{ opacity:1; }

  .pulse-ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    pointer-events:none;
  }
  .pulse-ring span{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.9);
    opacity:0;
  }
  .hotspot.playing .pulse-ring span{ animation: ring-out 900ms ease-out; }
  .hotspot.playing .pulse-ring span:nth-child(2){ animation-delay:130ms; }
  @keyframes ring-out{
    0%{ transform:scale(0.5); opacity:0.85; }
    100%{ transform:scale(2.6); opacity:0; }
  }

  .caption-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:12px 4px 2px;
  }
  .caption{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:14.5px;
    color:var(--ink-dim);
  }
  .hint{
    font-size:11.5px;
    color:var(--ink-dim);
  }

  .status-line{
    margin-top:14px;
    font-size:13px;
    color:var(--accent);
    min-height:18px;
    text-align:center;
    font-family:'Fraunces', serif;
    font-style:italic;
  }

  @media (prefers-reduced-motion: reduce){
    .pulse-ring span{ animation:none !important; }
    .photo-wrap img, .photo-wrap.playing img{ transition:none; }
  }
</style>
</head>

          <span class="ring"></span>
          <span class="badge">the crouched one</span>
          <span class="pulse-ring"><span></span><span></span></span>

          <span class="ring"></span>

  </div>

<script>
let actx = null;
function ctx(){
  if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if(actx.state === 'suspended') actx.resume();
  return actx;
}

function note(freq, start, dur, opts){
  const a = ctx();
  const o = a.createOscillator();
  const g = a.createGain();
  const filt = a.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.value = opts.cutoff || 3200;
  o.type = opts.wave || 'triangle';
  o.frequency.value = freq;
  o.connect(filt); filt.connect(g); g.connect(a.destination);
  const t0 = a.currentTime + start;
  const peak = opts.gain || 0.14;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(peak, t0 + Math.min(0.02, dur*0.2));
  g.gain.exponentialRampToValueAtTime(0.0007, t0 + dur);
  o.start(t0);
  o.stop(t0 + dur + 0.03);
}

// Melody for the crouched cat: quick, playful, pentatonic run (xylophone-ish)
function playCrouchedTune(){
  const seq = [
    [523.25, 0.00, 0.20], // C5
    [587.33, 0.16, 0.20], // D5
    [659.25, 0.32, 0.20], // E5
    [783.99, 0.48, 0.22], // G5
    [880.00, 0.70, 0.30], // A5
    [659.25, 1.00, 0.34], // E5
  ];
  seq.forEach(([f,s,d])=>note(f,s,d,{wave:'triangle', cutoff:4200, gain:0.15}));
}

// Melody for the loafing cat: slower, warmer, a little waltz-like drift
function playLoafTune(){
  const seq = [
    [220.00, 0.00, 0.42],  // A3
    [261.63, 0.34, 0.42],  // C4
    [329.63, 0.68, 0.50],  // E4
    [293.66, 1.10, 0.42],  // D4
    [246.94, 1.48, 0.60],  // B3
  ];
  seq.forEach(([f,s,d])=>note(f,s,d,{wave:'sine', cutoff:2000, gain:0.16}));
}

const photoWrap = document.getElementById('photoWrap');
const statusLine = document.getElementById('statusLine');
let statusTimer = null;

function wire(id, playFn, label){
  const btn = document.getElementById(id);
  btn.addEventListener('click', ()=>{
    playFn();
    btn.classList.remove('playing'); void btn.offsetWidth; btn.classList.add('playing');
    setTimeout(()=>btn.classList.remove('playing'), 900);

    photoWrap.classList.remove('playing'); void photoWrap.offsetWidth; photoWrap.classList.add('playing');
    setTimeout(()=>photoWrap.classList.remove('playing'), 700);

    statusLine.textContent = label;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(()=>{ statusLine.textContent = '\u00a0'; }, 2600);
  });
}

wire('catLeft', playCrouchedTune, "the crouched cat's tune plays");
wire('catRight', playLoafTune, "the loafing cat's tune plays");
</script>
